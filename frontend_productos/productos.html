<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestión de Productos</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="productos.css">
</head>
<body>
  <div class="wrap">

    <div class="topbar">
      <div class="title-block">
        <div class="eyebrow">Inventario</div>
        <h1>Productos</h1>
        <div class="count-tag" id="countTag">0 productos</div>
      </div>
    </div>

    <div class="toolbar">
      <div class="search">
        <span class="search-icon">⌕</span>
        <input id="searchInput" type="text"
               placeholder="Buscar producto por nombre o categoría...">
      </div>

      <button class="btn-add" id="openAdd">
        <span>＋</span>
        Nuevo producto
      </button>
    </div>

    <div class="grid" id="grid"></div>
  </div>

  <div class="overlay" id="overlay">
    <div class="modal">
      <button class="close-x" id="closeModal">×</button>

      <div class="m-eyebrow" id="modalEyebrow">Inventario</div>
      <h2 id="modalTitle">Registrar producto</h2>

      <div class="field">
        <label for="fName">Nombre</label>
        <input type="text" id="fName" placeholder="Ej. Café molido 500g">
      </div>

      <div class="field">
        <label for="fPrice">Precio</label>
        <input type="number" id="fPrice" placeholder="0.00"
               step="0.01" min="0">
      </div>

      <div class="field">
        <label for="fCategory">Categoría</label>
        <select id="fCategory"></select>
      </div>

      <div class="m-actions">
        <button class="m-btn cancel" id="cancelBtn">Cancelar</button>
        <button class="m-btn save" id="saveBtn">Guardar</button>
      </div>
    </div>
  </div>

  <script src="ProductoDTO.js"></script>
  <script src="ApiGatewayProducto.js"></script>
  <script src="ProductAdapter.js"></script>
  <script src="ProductoControladorUI.js"></script>
</body>
</html>
